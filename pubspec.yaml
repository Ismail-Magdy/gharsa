name: gharsa
description: "Gharsa - A comprehensive Flutter e-commerce app for exploring and purchasing plants and agricultural products"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  logger: ^2.8.0
  http_parser: ^4.1.2

  # Connectivity
  flutter_offline: ^6.0.0
  internet_connection_checker_plus: ^3.1.2

  # Local Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4

  # Responsive
  flutter_screenutil: ^5.9.3

  # UI & Design
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  skeletonizer: ^3.0.0
  lottie: ^3.6.1

  # Device Features
  url_launcher: ^6.3.3
  share_plus: ^12.0.2

  # Environment Variables
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lotties/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
