name: gharsa
description: "Gharsa - A comprehensive Flutter e-commerce app for exploring and purchasing plants and agricultural products"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # API & Networking & Code Generation
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  pretty_dio_logger: ^1.4.0
  logger: ^2.8.0
  http_parser: ^4.1.2

  # Offline & Connectivity
  flutter_offline: ^6.0.0
  internet_connection_checker_plus: ^3.1.2

  # Local Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4

  # Responsive
  flutter_screenutil: ^5.9.3

  # UI & Design
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  skeletonizer: ^3.0.0

  # Device Features
  url_launcher: ^6.3.3
  share_plus: ^12.0.2

  # Localization
  easy_localization: ^3.0.8

  # Environment Variables
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    # Fonts for Arabic script
    - family: "Cairo"
      fonts:
        - asset: assets/cairo/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/cairo/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/cairo/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/cairo/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/cairo/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/cairo/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/cairo/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/cairo/fonts/Cairo-Black.ttf
          weight: 900

    # Fonts for Arabic and Latin scripts
    - family: Tajawal
      fonts:
        - asset: assets/cairo/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/cairo/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/cairo/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/cairo/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/cairo/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/cairo/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/cairo/fonts/Tajawal-Black.ttf
          weight: 900
